name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: vet · tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        # Network engine tests are skipped without env vars (see README).
        run: go test ./...

      - name: go build
        run: go build ./...

  security:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  integration:
    name: network engine integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: start test databases
        # Waits until every container reports healthy (see compose.yaml).
        run: docker compose up -d --wait

      - name: integration tests
        env:
          PICKLOCK_TEST_POSTGRES_HOST: localhost
          PICKLOCK_TEST_POSTGRES_USER: postgres
          PICKLOCK_TEST_POSTGRES_PASSWORD: postgres
          PICKLOCK_TEST_POSTGRES_DATABASE: test
          PICKLOCK_TEST_MYSQL_HOST: localhost
          PICKLOCK_TEST_MYSQL_USER: root
          PICKLOCK_TEST_MYSQL_PASSWORD: root
          PICKLOCK_TEST_MYSQL_DATABASE: test
          PICKLOCK_TEST_MARIADB_HOST: localhost
          PICKLOCK_TEST_MARIADB_USER: root
          PICKLOCK_TEST_MARIADB_PASSWORD: root
          PICKLOCK_TEST_MARIADB_DATABASE: test
          PICKLOCK_TEST_MSSQL_HOST: localhost
          PICKLOCK_TEST_MSSQL_USER: sa
          PICKLOCK_TEST_MSSQL_PASSWORD: "Str0ng!Passw0rd"
          PICKLOCK_TEST_MSSQL_DATABASE: master
        run: go test -timeout 300s ./internal/store/...

      - name: teardown
        if: always()
        run: docker compose down
